name: Foodgram CI/CD

on: push

env:
  BACKEND_IMAGE: metralex/foodgram_backend
  FRONTEND_IMAGE: metralex/foodgram_frontend

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.12"]
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 -r ./backend/requirements.txt

      - run: cp .env.example backend/.env

      - run: |
          python -m flake8 backend/ --count --select=E9,F63,F7,F82
          cd backend && python manage.py test
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v3

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'infra/**'
            frontend:
              - 'frontend/**'

  build_backend:
    runs-on: ubuntu-latest
    needs:
      - test
      - detect_changes
    steps:
      - uses: actions/checkout@v3

      - name: Backend unchanged
        if: ${{ needs.detect_changes.outputs.backend != 'true' }}
        run: echo "Backend unchanged — skipping Docker build/push."

      - name: Build backend
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Login to Docker Hub
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend
        if: ${{ needs.detect_changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

  build_frontend:
    runs-on: ubuntu-latest
    needs:
      - test
      - detect_changes
    steps:
      - uses: actions/checkout@v3

      - name: Frontend unchanged
        if: ${{ needs.detect_changes.outputs.frontend != 'true' }}
        run: echo "Frontend unchanged — skipping Docker build/push."

      - name: Build frontend
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Login to Docker Hub
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push frontend
        if: ${{ needs.detect_changes.outputs.frontend == 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend
      - build_frontend
    steps:
      - uses: actions/checkout@v3

      - run: echo "${{ secrets.ENV_FILE_CONTENTS }}" > .env

      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: ".env"
          target: "foodgram"

      - uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "infra/"
          target: "foodgram"

      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd foodgram
            sudo docker compose -f infra/docker-compose.production.yml pull
            sudo docker compose -f infra/docker-compose.production.yml down
            sudo docker compose -f infra/docker-compose.production.yml up -d
            sleep 10
            sudo docker compose -f infra/docker-compose.production.yml exec -T backend python manage.py migrate --no-input
            sudo docker compose -f infra/docker-compose.production.yml exec -T backend python manage.py collectstatic --no-input

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ Deployment successful!
            Author: ${{ github.actor }}
            Repository: ${{ github.repository }}
            Commit: ${{ github.event.commits[0].message }}
