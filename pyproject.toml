[tool.black]
line-length = 79
target-version = ['py312']
include = '\.pyi?$'
quote-style = "single"

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["D"]  
ignore = [
    "D100",  
    "D104",  
    "D211",  
    "D212",  
]

[tool.ruff.lint.per-file-ignores]

"*/migrations/*.py" = ["D101", "D100"]

[tool.ruff.format]
quote-style = "single"